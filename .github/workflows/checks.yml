name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate geometry and schema
        run: node --test tests/layout.test.mjs tests/evaluate.test.mjs
      - name: Compare the pinned upstream compiler
        run: python3 tests/reference_check.py
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Exercise the browser editor
        run: python3 verify.py
      - name: Exercise the blind evaluator
        run: python3 verify_evaluator.py
